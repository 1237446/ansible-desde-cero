---
- name: Instalar Docker en Ubuntu (VM o contenedor Sysbox)
  hosts: ubuntu
  become: true
  vars:
    usuario_docker: "ansible"

  tasks:
    - name: 0. Saltar hosts que no sean Ubuntu
      ansible.builtin.meta: end_host
      when: ansible_facts['distribution'] != "Ubuntu"

    - name: 1. Instalar dependencias previas
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: 2. Crear directorio de keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: 3. Descargar llave GPG oficial de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: 4. Agregar repositorio oficial de Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default(ansible_facts['architecture']) }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present

    - name: 5. Instalar paquetes de Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: 6. Iniciar Docker vía systemd
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      when: ansible_facts['service_mgr'] == "systemd"

    - name: 7. Iniciar dockerd en segundo plano (contenedor sin systemd)
      ansible.builtin.shell: |
        if ! pgrep -x dockerd > /dev/null; then
          nohup dockerd > /var/log/dockerd.log 2>&1 &
        fi
      args:
        executable: /bin/bash
      changed_when: false
      when: ansible_facts['service_mgr'] != "systemd"

    - name: 8. Comprobar si el usuario existe
      ansible.builtin.getent:
        database: passwd
        key: "{{ usuario_docker }}"
      failed_when: false

    - name: 9. Agregar usuario al grupo docker (uso sin sudo)
      ansible.builtin.user:
        name: "{{ usuario_docker }}"
        groups: docker
        append: true
      when: ansible_facts.getent_passwd[usuario_docker] is defined

    - name: 10. Esperar a que Docker responda
      ansible.builtin.command: docker info --format '{{ "{{" }}.Driver{{ "}}" }}'
      register: docker_status
      changed_when: false
      retries: 10
      delay: 3
      until: docker_status.rc == 0

    - name: 11. Confirmación
      ansible.builtin.debug:
        msg: "Docker funcionando en {{ inventory_hostname }} (Storage Driver: {{ docker_status.stdout }})"
