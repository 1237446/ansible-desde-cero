services:
  ansible-control:
    image: ubuntu:latest
    container_name: ansible-control
    volumes:
      - ./ansible_data:/home/ansible
    tty: true
    networks:
      - ansible-net

  ubuntu-node1:
    image: ubuntu:latest
    container_name: ubuntu-node1
    tty: true
    networks:
      - ansible-net

  ubuntu-node2:
    image: ubuntu:latest
    container_name: ubuntu-node2
    tty: true
    networks:
      - ansible-net

  rhel-node1:
    image: rockylinux:9
    container_name: rhel-node1
    tty: true
    networks:
      - ansible-net

  rhel-node2:
    image: rockylinux:9
    container_name: rhel-node2
    tty: true
    networks:
      - ansible-net

networks:
  ansible-net:
    driver: bridge
